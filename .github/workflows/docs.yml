name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/prepare_docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/prepare_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: docs/Gemfile
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install documentation dependencies
        run: bundle install
      - name: Prepare independent language sites
        run: python scripts/prepare_docs.py
      - name: Build Chinese documentation
        run: bundle exec jekyll build --source _build/docs-source/zh --destination _site/zh --config _build/docs-source/zh/_config.yml,_build/docs-source/zh/_config.language.yml
      - name: Build English documentation
        run: bundle exec jekyll build --source _build/docs-source/en --destination _site/en --config _build/docs-source/en/_config.yml,_build/docs-source/en/_config.language.yml
      - name: Preserve old documentation URLs
        run: python scripts/prepare_docs.py --finalize
      # Mirrors and pull requests validate the site without publishing it.
      - name: Upload public documentation
        if: github.repository == 'Chal1ce/FinFlow' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.repository == 'Chal1ce/FinFlow' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
