[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finflow"
version = "0.1.0"
description = "Local-first financial document data flywheel with OCR, governance, lineage, pretraining and evidence-grounded SFT data generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "certifi>=2024.2.2",
  "openai>=1.0.0",
  "pypdf>=5.0.0",
  "requests>=2.31",
  "Pillow>=10.0",
  "PyMuPDF>=1.24",
  "tokenizers>=0.20",
]

[project.optional-dependencies]
mixture-training = ["torch>=2.6,<3", "numpy>=1.26,<3", "lightgbm>=4.3,<5"]
feishu = ["lark-oapi>=1.5,<2"]
discord = ["discord.py>=2.4,<3"]
slack = ["slack-sdk>=3.33,<4"]
mcp = ["mcp>=1.28,<2"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["core*", "delivery*", "ingestion*", "integrations*", "processing*", "qc*", "remote*", "spiders*", "storage*", "training*", "workflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F"]
